name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, for example v0.1.0'
        required: true
      dry_run:
        description: 'Run every gate and skip all publishing'
        type: boolean
        default: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.17.0

      - run: npm ci

      - name: The tag and every package agree on the version
        run: node scripts/check-version.mjs "$TAG"

      - name: Choose the marketplace channel
        id: channel
        run: |
          version="${TAG#v}"
          if [ "${version%%.*}" = "0" ]; then
            echo 'flag=--pre-release' >> "$GITHUB_OUTPUT"
          else
            echo 'flag=' >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Contrast gate
        run: npm run verify

      - name: Test
        run: npm test

      - name: Sync DESIGN.md
        run: npm run sync:design

      - name: Generated files match the tag
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The tagged tree does not match its own generated output."
            git status --porcelain
            git --no-pager diff
            exit 1
          fi

      - name: Package the extension
        run: npm run package -w ./packages/vscode -- ${{ steps.channel.outputs.flag }}

      - name: Write the release notes
        shell: bash
        run: |
          set -o pipefail
          node scripts/release-notes.mjs "$TAG" > release-notes.md
          cat release-notes.md

      - name: Check npm packages
        run: |
          npm publish -w @sltsh/aion-tokens --dry-run
          npm publish -w @sltsh/aion-css --dry-run

      - name: Publish npm packages
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          result=$(mktemp)
          trap 'rm -f "$result"' EXIT
          for package in tokens css; do
            name=$(node -p "require('./packages/$package/package.json').name")
            version=$(node -p "require('./packages/$package/package.json').version")
            if npm view "$name@$version" version --json --registry=https://registry.npmjs.org/ > "$result"; then
              echo "$name@$version is already published; skipping."
            elif jq -e '.error.code == "E404"' "$result" > /dev/null; then
              npm publish -w "./packages/$package" --tag latest
            else
              cat "$result"
              exit 1
            fi
          done

      - name: Publish to the Visual Studio Marketplace
        if: ${{ !inputs.dry_run }}
        working-directory: packages/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --no-dependencies --skip-duplicate --packagePath aion-*.vsix

      - name: Publish to Open VSX
        if: ${{ !inputs.dry_run }}
        working-directory: packages/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish --skip-duplicate --packagePath aion-*.vsix

      - name: Create the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" packages/vscode/aion-*.vsix \
            --title "Aion $TAG" \
            --notes-file release-notes.md \
            ${{ steps.channel.outputs.flag == '--pre-release' && '--prerelease' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: aion-${{ env.TAG }}
          path: |
            packages/vscode/*.vsix
            release-notes.md
          if-no-files-found: error
