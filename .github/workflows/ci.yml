name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Contrast gate
        run: npm run verify

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Sync DESIGN.md
        run: npm run sync:design

      - name: Generated files match the commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::A build or sync changed a tracked file. Run 'npm run build && npm run sync:design' and commit the result."
            git status --porcelain
            git --no-pager diff
            exit 1
          fi

      - name: Package the extension
        if: matrix.node == '24'
        run: npm run package -w ./packages/vscode

      - uses: actions/upload-artifact@v4
        if: matrix.node == '24'
        with:
          name: aion-vsix
          path: packages/vscode/*.vsix
          if-no-files-found: error
