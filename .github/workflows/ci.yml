name: CI

# A pull request from this repository is already covered by the push to its branch.
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Contrast gate
        run: npm run verify

      - name: Test
        run: npm test

      - name: Sync DESIGN.md
        run: npm run sync:design

      - name: Generated files match the commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::A build or sync changed a tracked file. Run 'npm run build && npm run sync:design' and commit the result."
            git status --porcelain
            git --no-pager diff
            exit 1
          fi

      - name: Package the extension
        if: matrix.node == '24'
        run: npm run package -w ./packages/vscode

      - uses: actions/upload-artifact@v4
        if: matrix.node == '24'
        with:
          name: aion-vsix
          path: packages/vscode/*.vsix
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v3
        if: matrix.node == '24' && github.ref == 'refs/heads/main'
        with:
          path: apps/site/dist

  site:
    name: Deploy the site
    needs: gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5

      - id: deploy
        uses: actions/deploy-pages@v4
