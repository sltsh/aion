<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aion &mdash; Aether, no violet</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 24px;
    background: #0e0f11; color: #c9cdd4;
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; color: #e8eaee; letter-spacing: -0.01em; }
  .sub { margin: 0 0 28px; color: #7d838c; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 20px; }
  .col { min-width: 0; }
  .colhead { margin-bottom: 10px; }
  .colhead h2 { font-size: 15px; margin: 0 0 2px; color: #e8eaee; }
  .colhead p { margin: 0; font-size: 12px; color: #7d838c; min-height: 32px; }
  .panel { border-radius: 8px; overflow: hidden; border: 1px solid #24262b; margin-bottom: 12px; }
  .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-bottom: 12px; }
  .sw { height: 34px; border-radius: 5px; position: relative; }
  .sw span { position: absolute; bottom: 2px; left: 3px; font-size: 8px; color: rgba(0,0,0,.6); font-weight: 700; }
  .neutrals { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; margin-bottom: 12px; }
  .nsw { height: 22px; border-radius: 3px; }

  /* editor mock */
  .ed { font: 12px/1.55 ui-monospace, "JetBrains Mono", "Cascadia Code", Menlo, monospace; }
  .tabs { display: flex; align-items: stretch; height: 30px; font-size: 11px; }
  .tab { display: flex; align-items: center; padding: 0 12px; }
  .tab.on { border-top: 1px solid; }
  .edbody { display: flex; }
  .gut { padding: 8px 8px 12px 10px; text-align: right; user-select: none; }
  .code { padding: 8px 12px 12px 4px; flex: 1; white-space: pre; overflow: hidden; }
  .stat { height: 22px; display: flex; align-items: center; padding: 0 10px; font-size: 10px; gap: 14px; }

  /* terminal mock */
  .term { font: 12px/1.55 ui-monospace, "Cascadia Code", Menlo, monospace; padding: 10px 12px; }

  /* ui mock */
  .ui { padding: 14px; }
  .card { border-radius: 6px; padding: 12px; border: 1px solid; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .btn { border: 0; border-radius: 5px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: transparent; border: 1px solid; }
  .badge { border-radius: 999px; padding: 2px 9px; font-size: 10px; font-weight: 700; }
  .inp { border-radius: 5px; padding: 6px 9px; font-size: 12px; border: 1px solid; width: 100%; margin-top: 10px; }
  .bar { height: 6px; border-radius: 999px; margin-top: 12px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 62%; }

  table.cr { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 4px; }
  table.cr td { padding: 2px 4px; border-bottom: 1px solid #1c1e22; }
  table.cr td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .pass { color: #6fbf73; } .warn { color: #d8a657; } .fail { color: #e06c6c; font-weight: 700; }
  .note { font-size: 11px; color: #6b7079; margin-top: 6px; }
</style>
</head>
<body>
<h1>Aion &mdash; Aether without violet</h1>
<p class="sub">You chose Aether but rejected violet. Violet did two jobs: the base tint and the One&nbsp;Dark&nbsp;Pro keyword hue. These three variants remove it from both, in different ways. Contrast is WCAG 2.x against the editor background; the floor is 4.5.</p>
<div class="grid" id="grid"></div>

<script>
const CONCEPTS = [
  {
    id: 'steel', name: 'V1 &middot; Steel',
    story: 'Cool steel base, no violet tint. Keywords move from violet to rose. Gold leads the chrome.',
    baseH: 250, baseC: 0.008,
    acc: {
      gold:   [0.840, 0.130,  90],
      cyan:   [0.810, 0.105, 215],
      copper: [0.765, 0.125,  55],
      green:  [0.805, 0.115, 150],
      blue:   [0.775, 0.115, 255],
      rose:   [0.760, 0.130, 352],
      coral:  [0.740, 0.135,  20],
      teal:   [0.800, 0.105, 185],
    },
    roles: { kw:'rose', fn:'blue', st:'green', nu:'copper', cn:'copper', ty:'gold',
             va:'coral', pr:'coral', par:'coral', esc:'cyan', op:'teal', chrome:'gold', ok:'green' }
  },
  {
    id: 'void', name: 'V2 &middot; Void',
    story: 'Same hues, but the base carries no tint at all. A true neutral grey. Maximum accent purity.',
    baseH: 250, baseC: 0.000,
    acc: {
      gold:   [0.840, 0.130,  90],
      cyan:   [0.810, 0.105, 215],
      copper: [0.765, 0.125,  55],
      green:  [0.805, 0.115, 150],
      blue:   [0.775, 0.115, 255],
      rose:   [0.760, 0.130, 352],
      coral:  [0.740, 0.135,  20],
      teal:   [0.800, 0.105, 185],
    },
    roles: { kw:'rose', fn:'blue', st:'green', nu:'copper', cn:'copper', ty:'gold',
             va:'coral', pr:'coral', par:'coral', esc:'cyan', op:'teal', chrome:'gold', ok:'green' }
  },
  {
    id: 'goldkey', name: 'V3 &middot; Gold Key',
    story: 'No violet and no rose. Keywords take the signature gold, types take cyan. Six hues, tightest set.',
    baseH: 250, baseC: 0.008,
    acc: {
      gold:   [0.840, 0.130,  90],
      cyan:   [0.810, 0.105, 215],
      copper: [0.765, 0.125,  55],
      green:  [0.805, 0.115, 150],
      blue:   [0.775, 0.115, 255],
      teal:   [0.800, 0.105, 185],
      coral:  [0.740, 0.135,  20],
      sand:   [0.800, 0.070,  75],
    },
    roles: { kw:'gold', fn:'blue', st:'green', nu:'copper', cn:'copper', ty:'cyan',
             va:'coral', pr:'coral', par:'coral', esc:'teal', op:'teal', chrome:'gold', ok:'green' }
  },
];

// 12-step neutral ramp, Radix model: 1-2 bg, 3-5 component, 6-8 border, 9-10 solid, 11-12 text
const NEUTRAL_L = [0.175, 0.205, 0.245, 0.278, 0.310, 0.355, 0.410, 0.515, 0.575, 0.630, 0.740, 0.930];

/* ---------- color math: oklch -> sRGB -> luminance ---------- */
function oklch2rgb(L, C, H) {
  const h = H * Math.PI / 180, a = C * Math.cos(h), b = C * Math.sin(h);
  const l_ = L + 0.3963377774*a + 0.2158037573*b;
  const m_ = L - 0.1055613458*a - 0.0638541728*b;
  const s_ = L - 0.0894841775*a - 1.2914855480*b;
  const l = l_**3, m = m_**3, s = s_**3;
  let r = +4.0767416621*l - 3.3077115913*m + 0.2309699292*s;
  let g = -1.2684380046*l + 2.6097574011*m - 0.3413193965*s;
  let bb= -0.0041960863*l - 0.7034186147*m + 1.7076147010*s;
  return [r, g, bb].map(v => Math.min(1, Math.max(0, v)));
}
const gamma = u => u <= 0.0031308 ? 12.92*u : 1.055*Math.pow(u, 1/2.4) - 0.055;
function hex(L, C, H) {
  const [r,g,b] = oklch2rgb(L,C,H).map(gamma);
  const c = v => Math.round(Math.min(1,Math.max(0,v))*255).toString(16).padStart(2,'0');
  return '#' + c(r) + c(g) + c(b);
}
function lum(L, C, H) {
  const [r,g,b] = oklch2rgb(L,C,H);
  return 0.2126*r + 0.7152*g + 0.0722*b;
}
function ratio(a, b) {
  const l1 = Math.max(a,b), l2 = Math.min(a,b);
  return (l1 + 0.05) / (l2 + 0.05);
}

/* ---------- render ---------- */
const CODE = [
  ['kw','export'],['sp',' '],['kw','async'],['sp',' '],['kw','function'],['sp',' '],['fn','loadEpoch'],['pn','('],['par','id'],['pn',': '],['ty','string'],['pn',') {'],['nl'],
  ['sp','  '],['cm','// resolve the age from the registry'],['nl'],
  ['sp','  '],['kw','const'],['sp',' '],['va','entry'],['sp',' '],['op','='],['sp',' '],['kw','await'],['sp',' '],['va','registry'],['pn','.'],['fn','get'],['pn','('],['va','id'],['pn',')'],['pn',';'],['nl'],
  ['sp','  '],['kw','if'],['sp',' '],['pn','('],['op','!'],['va','entry'],['pn',') '],['kw','throw'],['sp',' '],['kw','new'],['sp',' '],['ty','NotFoundError'],['pn','('],['st','`no epoch '],['esc','${'],['va','id'],['esc','}'],['st','`'],['pn',');'],['nl'],
  ['nl'],
  ['sp','  '],['kw','return'],['sp',' '],['pn','{'],['nl'],
  ['sp','    '],['pr','name'],['pn',': '],['va','entry'],['pn','.'],['pr','label'],['pn',','],['nl'],
  ['sp','    '],['pr','span'],['pn',': '],['nu','1_440'],['sp',' '],['op','*'],['sp',' '],['nu','365'],['pn',','],['nl'],
  ['sp','    '],['pr','eternal'],['pn',': '],['cn','true'],['pn',','],['nl'],
  ['sp','  '],['pn','};'],['nl'],
  ['pn','}'],
];

function build(c) {
  const N = NEUTRAL_L.map(L => hex(L, c.baseC, c.baseH));
  const NL = NEUTRAL_L.map(L => lum(L, c.baseC, c.baseH));
  const A = {}, AL = {};
  for (const [k,v] of Object.entries(c.acc)) { A[k] = hex(...v); AL[k] = lum(...v); }

  const bg = N[1], bgLum = NL[1];
  const comment = hex(0.615, c.baseC + 0.006, c.baseH);
  const commentLum = lum(0.615, c.baseC + 0.006, c.baseH);

  const R = c.roles;
  const pick = k => A[R[k]];
  const pickL = k => AL[R[k]];
  const syn = {
    kw: pick('kw'), fn: pick('fn'), st: pick('st'), nu: pick('nu'), cn: pick('cn'),
    ty: pick('ty'), va: pick('va'), pr: pick('pr'), par: pick('par'),
    esc: pick('esc'), op: pick('op'), pn: N[10], cm: comment, sp: null, nl: null,
  };
  const synLum = {
    kw: pickL('kw'), fn: pickL('fn'), st: pickL('st'), nu: pickL('nu'),
    ty: pickL('ty'), va: pickL('va'), esc: pickL('esc'), op: pickL('op'),
    pn: NL[10], cm: commentLum,
  };
  const CHROME = A[R.chrome], OK = A[R.ok];

  const el = document.createElement('div');
  el.className = 'col';

  const swatchRow = Object.entries(A).map(([k,v]) =>
    `<div class="sw" style="background:${v}"><span>${k}</span></div>`).join('');
  const neutralRow = N.map((v,i) => `<div class="nsw" style="background:${v}" title="step ${i+1}"></div>`).join('');

  const codeHtml = CODE.map(([t, txt]) => {
    if (t === 'nl') return '\n';
    if (t === 'sp') return txt;
    return `<span style="color:${syn[t]}">${txt.replace(/</g,'&lt;')}</span>`;
  }).join('');

  const gutter = Array.from({length: 12}, (_,i) => i+1).join('\n');

  const crRows = Object.entries(synLum).map(([k,l]) => {
    const r = ratio(l, bgLum);
    const cls = r >= 4.5 ? 'pass' : r >= 3 ? 'warn' : 'fail';
    return `<tr><td>${k}</td><td style="color:${syn[k]}">Aa</td><td class="${cls}">${r.toFixed(2)}</td></tr>`;
  }).join('');

  el.innerHTML = `
    <div class="colhead"><h2>${c.name}</h2><p>${c.story}</p></div>

    <div class="swatches">${swatchRow}</div>
    <div class="neutrals">${neutralRow}</div>

    <div class="panel ed" style="background:${bg};border-color:${N[5]}">
      <div class="tabs" style="background:${N[0]};color:${N[9]}">
        <div class="tab" >epoch.ts</div>
        <div class="tab on" style="background:${bg};color:${N[11]};border-top-color:${CHROME}">registry.ts</div>
        <div class="tab">README.md</div>
      </div>
      <div class="edbody">
        <div class="gut" style="color:${N[7]}">${gutter}</div>
        <div class="code" style="color:${N[11]}">${codeHtml}</div>
      </div>
      <div class="stat" style="background:${N[0]};color:${N[9]}">
        <span style="color:${OK}">&#9679; main</span><span>Ln 8, Col 24</span><span>TypeScript</span>
        <span style="margin-left:auto;color:${syn.va}">2 problems</span>
      </div>
    </div>

    <div class="panel term" style="background:${N[0]};color:${N[11]};border-color:${N[5]}">
<span style="color:${OK}">&#10148;</span> <span style="color:${syn.fn}">aion</span> <span style="color:${CHROME}">git:(</span><span style="color:${syn.va}">main</span><span style="color:${CHROME}">)</span> npm run build
<span style="color:${comment}">&gt; aion@0.1.0 build</span>
<span style="color:${OK}">&#10003;</span> tokens    <span style="color:${N[9]}">142 emitted</span>
<span style="color:${OK}">&#10003;</span> contrast  <span style="color:${N[9]}">all pairs &#8805; 4.5</span>
<span style="color:${syn.nu}">!</span> vsix      <span style="color:${N[9]}">1 warning</span>
</div>

    <div class="panel ui" style="background:${N[0]};border-color:${N[5]}">
      <div class="card" style="background:${N[2]};border-color:${N[6]}">
        <div style="color:${N[11]};font-weight:600;font-size:13px">Epoch registry</div>
        <div style="color:${N[10]};font-size:12px;margin-top:2px">
          Records that outlast the process. <a href="#" style="color:${syn.fn}">Read the spec</a>.
        </div>
        <div class="bar" style="background:${N[4]}"><i style="background:${CHROME}"></i></div>
        <input class="inp" style="background:${N[1]};border-color:${N[6]};color:${N[11]}" value="aion://epoch/1440">
        <div class="row">
          <button class="btn" style="background:${CHROME};color:${N[0]}">Publish</button>
          <button class="btn ghost" style="border-color:${N[7]};color:${N[11]}">Cancel</button>
          <span class="badge" style="background:${OK};color:${N[0]}">stable</span>
          <span class="badge" style="background:${syn.va};color:${N[0]}">2 errors</span>
          <span class="badge" style="background:${N[4]};color:${N[11]}">draft</span>
        </div>
      </div>
    </div>

    <table class="cr">${crRows}</table>
    <div class="note">Editor bg ${bg} &middot; base hue ${c.baseH}&deg;</div>
  `;
  return el;
}

const grid = document.getElementById('grid');
CONCEPTS.forEach(c => grid.appendChild(build(c)));
</script>
</body>
</html>
